<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>axisOS</title>
<style>
/* =========================================================
   axisOS — single-file desktop environment
   Document setup / CSS variables and themes
========================================================= */
:root{
 --accent:#8b9cff;--accent-rgb:139,156,255;--bg:#10131c;--panel:rgba(25,29,42,.78);
 --panel-strong:rgba(27,32,47,.96);--surface:rgba(255,255,255,.075);--surface2:rgba(255,255,255,.12);
 --text:#f2f4fb;--muted:#a5acc0;--line:rgba(255,255,255,.12);--shadow:0 24px 80px rgba(0,0,0,.38);
 --blur:22px;--radius:17px;--taskbar:66px;
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color-scheme:dark;
}
:root[data-theme="light"]{
 --bg:#e8ebf3;--panel:rgba(255,255,255,.76);--panel-strong:rgba(249,250,255,.97);
 --surface:rgba(28,37,61,.055);--surface2:rgba(28,37,61,.10);--text:#20263a;--muted:#697188;
 --line:rgba(30,40,65,.13);--shadow:0 24px 80px rgba(40,48,70,.20);color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:transparent;color:var(--muted);transition:.18s}
button.icon-btn:hover{background:var(--surface2);color:var(--text)}
.btn{padding:10px 14px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);transition:.18s}
.btn:hover{background:var(--surface2);filter:brightness(1.12);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#10131c;border-color:transparent;font-weight:650}
.btn.danger{color:#ff8585}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical}
.app-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:white;box-shadow:inset 0 1px 0 #ffffff35,0 7px 18px #0002;flex:none}
.app-icon svg{width:21px;height:21px}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--shadow)}
/* Boot and authentication */
#boot,#auth{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#090b11}
.boot-mark{font-size:42px;font-weight:750;letter-spacing:-3px;animation:markIn 1s ease both}
.boot-mark span{color:var(--accent)}
.boot-sub{color:#8c93a8;letter-spacing:3px;text-transform:uppercase;font-size:10px;margin-top:12px;text-align:center}
.boot-line{height:2px;width:170px;background:#252a39;margin:32px auto 0;overflow:hidden;border-radius:4px}
.boot-line:after{content:"";display:block;height:100%;width:35%;background:var(--accent);animation:load 1.4s ease-in-out infinite}
@keyframes markIn{from{opacity:0;transform:translateY(12px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(400%)}}
#auth{background:radial-gradient(ellipse at 50% 30%,#29334e,#10131c 60%,#090b11);padding:20px}
.auth-card{width:min(410px,100%);padding:34px;border-radius:24px;background:rgba(25,29,42,.82);border:1px solid #ffffff1c;backdrop-filter:blur(24px);box-shadow:0 30px 100px #0008}
.auth-logo{font-size:28px;font-weight:750;letter-spacing:-1.8px;margin-bottom:5px}.auth-logo span{color:var(--accent)}
.auth-card h2{font-size:20px;margin:25px 0 5px}.auth-card p{font-size:13px;color:#a5acc0;line-height:1.5}
.auth-card label{display:block;font-size:12px;color:#b8bfd0;margin:15px 0 7px}
.auth-card input{width:100%;background:#ffffff0b;border-color:#ffffff20}
.auth-card .btn{width:100%;margin-top:19px}
.avatar-choice{display:flex;gap:9px;margin-top:10px}.avatar-choice button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.avatar-choice button.selected{outline:2px solid white;outline-offset:2px}
/* Desktop shell */
#desktop{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 75% 20%,#495d9b 0%,transparent 38%),radial-gradient(ellipse at 20% 85%,#243c5e 0%,transparent 40%),linear-gradient(135deg,#171d2c,#10131c 65%);background-size:cover;background-position:center;transition:background .4s}
#wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#080b1420,#080b1440)}
#desktop-icons{position:absolute;z-index:2;inset:18px auto calc(var(--taskbar) + 18px) 16px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:9px}
.desktop-icon{width:82px;padding:9px 5px;border-radius:12px;display:flex;align-items:center;flex-direction:column;gap:7px;background:transparent;color:white;text-shadow:0 1px 4px #0009;font-size:11px;text-align:center;cursor:grab;border:1px solid transparent}
.desktop-icon:hover,.desktop-icon.selected{background:#ffffff18;border-color:#ffffff22}
.desktop-icon .app-icon{width:42px;height:42px}
#widgets{position:absolute;right:22px;top:22px;z-index:2;display:flex;gap:10px;align-items:flex-start}
.widget{padding:15px 17px;border-radius:16px;min-width:145px;background:#10152272;border:1px solid #ffffff20;backdrop-filter:blur(16px);color:white;text-shadow:0 1px 4px #0005}
.widget .big{font-size:28px;font-weight:650;letter-spacing:-1px}.widget .small{color:#d0d5e2}
#taskbar{position:absolute;z-index:500;bottom:0;left:0;right:0;height:var(--taskbar);display:flex;align-items:center;justify-content:center;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.dock{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:17px;background:var(--surface);border:1px solid var(--line)}
.dock-btn{position:relative;width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:transparent;transition:transform .18s,background .18s}
.dock-btn:hover{transform:translateY(-5px) scale(1.08);background:var(--surface2)}
.dock-btn .app-icon{width:38px;height:38px}
.dock-btn.running:after{content:"";position:absolute;bottom:-4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.dock-btn.active{background:var(--surface2)}
.task-side{position:absolute;right:14px;display:flex;align-items:center;gap:4px}
.task-left{position:absolute;left:14px;display:flex;align-items:center;gap:7px}
.system-pill{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:11px;background:transparent;color:var(--text);font-size:11px}
.system-pill:hover{background:var(--surface2)}
#clock{font-size:11px;line-height:1.35;text-align:right;min-width:70px}
#start-menu,#search-panel,#quick-panel,#notification-panel,#context-menu,#desktop-switcher{position:absolute;z-index:800;border-radius:18px;background:var(--panel-strong);border:1px solid var(--line);backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);animation:panelIn .18s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
#start-menu{bottom:78px;left:16px;width:340px;padding:18px}
#start-menu h3{font-size:13px;margin:0 0 13px}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.launch-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 5px;border-radius:12px;background:transparent;font-size:11px}
.launch-tile:hover{background:var(--surface2)}
#search-panel{top:16%;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));padding:14px}
#search-panel input{width:100%;font-size:16px;padding:14px}
.search-results{max-height:340px;overflow:auto;margin-top:10px}
.search-result{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px;border-radius:10px;background:transparent}
.search-result:hover{background:var(--surface2)}
#quick-panel,#notification-panel{right:14px;bottom:78px;width:min(340px,calc(100% - 28px));padding:17px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.panel-head strong{font-size:14px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.quick-tile{padding:13px;border-radius:12px;background:var(--surface);text-align:left;font-size:12px}
.quick-tile.on{background:rgba(var(--accent-rgb),.22);border:1px solid rgba(var(--accent-rgb),.4)}
.notification{padding:12px;border-radius:12px;background:var(--surface);margin:8px 0;font-size:12px}
.notification small{display:block;color:var(--muted);margin-top:5px}
#context-menu{min-width:175px;padding:6px}
.context-item{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px;background:transparent;font-size:12px}
.context-item:hover{background:var(--surface2)}
/* Window manager */
#window-layer{position:absolute;z-index:20;inset:0 0 var(--taskbar);pointer-events:none}
.os-window{position:absolute;pointer-events:auto;min-width:280px;min-height:190px;width:680px;height:470px;max-width:calc(100vw - 20px);max-height:calc(100% - 12px);border:1px solid var(--line);border-radius:16px;background:var(--panel-strong);backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:windowIn .2s ease}
@keyframes windowIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.os-window.focused{border-color:rgba(var(--accent-rgb),.48);box-shadow:0 25px 80px #0004,0 0 0 1px rgba(var(--accent-rgb),.12)}
.os-window.maximized{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;max-width:none;max-height:none;border-radius:12px}
.os-window.snapped-left{left:8px!important;top:8px!important;width:calc(50% - 12px)!important;height:calc(100% - 16px)!important}
.os-window.snapped-right{left:calc(50% + 4px)!important;top:8px!important;width:calc(50% - 12px)!important;height:calc(100% - 16px)!important}
.window-titlebar{height:47px;min-height:47px;display:flex;align-items:center;padding:0 12px;gap:10px;border-bottom:1px solid var(--line);cursor:grab;user-select:none}
.window-titlebar:active{cursor:grabbing}
.window-title{font-size:12px;font-weight:650;flex:1}
.window-controls{display:flex;gap:5px}
.window-controls button{width:25px;height:25px;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center}
.window-controls button:hover{background:var(--surface2);color:var(--text)}
.window-controls .close:hover{background:#e35c68;color:white}
.window-controls svg{width:12px;height:12px}
.window-body{flex:1;min-height:0;overflow:auto;padding:16px}
.window-body.no-pad{padding:0;overflow:hidden}
.resize-handle{position:absolute;right:0;bottom:0;width:17px;height:17px;cursor:nwse-resize}
.resize-handle:after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);opacity:.5}
.app-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
.app-toolbar input{flex:1}
.app-section-title{font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:1px;margin:8px 0 12px}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.file-item{padding:12px 7px;border-radius:12px;text-align:center;background:transparent;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.file-item:hover{background:var(--surface2)}
.file-item svg{margin:0 auto 8px;width:25px;height:25px;color:var(--accent)}
.note-layout{display:grid;grid-template-columns:180px 1fr;height:100%;min-height:300px}
.note-list{border-right:1px solid var(--line);padding:10px;overflow:auto}
.note-list button{display:block;width:100%;text-align:left;padding:10px;border-radius:9px;background:transparent;font-size:12px;margin-bottom:4px}
.note-list button.active,.note-list button:hover{background:var(--surface2)}
.note-editor{display:flex;flex-direction:column;padding:16px;gap:10px;min-width:0}
.note-editor input{font-size:18px;font-weight:650;border:0;background:transparent;padding:5px 0}
.note-editor textarea{flex:1;min-height:180px;border:0;background:transparent;line-height:1.65}
.calc{max-width:340px;margin:auto}
.calc-display{width:100%;text-align:right;font-size:31px;padding:20px 10px;border:0;background:transparent}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{height:55px;border-radius:13px;background:var(--surface);font-size:16px}
.calc-grid button:hover{background:var(--surface2)}
.calc-grid button.operator{color:var(--accent)}
.calc-grid button.equal{background:var(--accent);color:#10131c}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calendar-grid>div{min-height:65px;padding:7px;border-radius:9px;background:var(--surface);font-size:11px}
.calendar-grid .day-name{min-height:auto;background:transparent;color:var(--muted);text-align:center}
.calendar-grid .today{outline:1px solid var(--accent)}
.calendar-grid .has-event:after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:6px}
.settings-layout{display:grid;grid-template-columns:145px 1fr;gap:18px;min-height:100%}
.settings-nav button{display:block;width:100%;text-align:left;background:transparent;padding:10px;border-radius:9px;font-size:12px}
.settings-nav button.active,.settings-nav button:hover{background:var(--surface2)}
.settings-content h2{font-size:18px;margin:0 0 5px}.settings-content p{font-size:12px;color:var(--muted);line-height:1.5}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches button{width:27px;height:27px;border-radius:50%;border:2px solid transparent}.swatches button.selected{outline:2px solid var(--text);outline-offset:2px}
.browser-bar{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.browser-bar input{flex:1;padding:8px}
.browser-frame{width:100%;height:100%;border:0;background:white}
.browser-placeholder{height:100%;display:grid;place-items:center;text-align:center;padding:25px}
.music-layout{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;height:100%;text-align:center}
.album-art{width:155px;height:155px;border-radius:20px;background:linear-gradient(135deg,var(--accent),#27314e);display:grid;place-items:center;box-shadow:0 20px 40px #0003}
.album-art svg{width:54px;height:54px}
.music-controls{display:flex;align-items:center;gap:15px}
.progress{width:min(380px,90%);accent-color:var(--accent)}
/* lock screen / desktop switcher */
#lock-screen{position:fixed;inset:0;z-index:950;background:linear-gradient(140deg,#151c2cdd,#080b12f2),var(--bg);display:grid;place-items:center;text-align:center;color:white;backdrop-filter:blur(20px)}
.lock-time{font-size:clamp(48px,10vw,86px);font-weight:250;letter-spacing:-4px}.lock-date{color:#b5bdd0;margin:5px 0 28px}
#desktop-switcher{left:50%;top:35%;transform:translateX(-50%);display:flex;gap:10px;padding:12px}
.desktop-card{width:130px;height:85px;border-radius:11px;background:linear-gradient(135deg,#303d61,#171c2a);border:2px solid transparent;display:grid;place-items:center;font-size:12px}
.desktop-card.active{border-color:var(--accent)}
/* responsive */
@media(max-width:700px){
 :root{--taskbar:62px}
 #widgets{top:12px;right:12px}.widget{min-width:110px;padding:10px}.widget .big{font-size:22px}
 #desktop-icons{top:14px;left:8px}.desktop-icon{width:70px}
 .task-left{left:8px}.task-side{right:7px}.task-side .system-pill:not(#quick-open){display:none}
 .dock{gap:2px;padding:4px}.dock-btn{width:39px;height:39px}
 .os-window{left:5px!important;top:5px!important;width:calc(100% - 10px)!important;height:calc(100% - 10px)!important;max-width:none;max-height:none;border-radius:13px}
 .os-window.maximized{left:4px!important;top:4px!important;width:calc(100% - 8px)!important;height:calc(100% - 8px)!important}
 .settings-layout{grid-template-columns:105px 1fr;gap:10px}
 .note-layout{grid-template-columns:112px 1fr}
 .calendar-grid>div{min-height:48px;padding:4px}
 #start-menu{width:min(340px,calc(100% - 20px));left:10px}
}
</style>
</head>

</svg>
<div id="boot"><div><div class="boot-mark">axis<span>OS</span></div><div class="boot-sub">A quieter kind of computing</div><div class="boot-line"></div></div></div>
<div id="auth" class="hidden"><div class="auth-card" id="auth-card"></div></div>
<div id="desktop" class="hidden">
 <div id="wallpaper"></div>
 <div id="desktop-icons"></div>
 <div id="widgets"><div class="widget"><div class="big" id="widget-time">--:--</div><div class="small" id="widget-date">Loading date</div></div></div>
 <div id="window-layer"></div>
 <div id="start-menu" class="hidden"></div>
 <div id="search-panel" class="hidden"><input id="global-search" placeholder="Search apps, files and settings…"><div class="search-results" id="search-results"></div></div>
 <div id="quick-panel" class="hidden"></div>
 <div id="notification-panel" class="hidden"></div>
 <div id="context-menu" class="hidden"></div>
 <div id="desktop-switcher" class="hidden"></div>
 <div id="taskbar">
  <div class="task-left"><button class="system-pill" id="start-button" title="Start menu"><svg><use href="#i-grid"/></svg></button><button class="system-pill" id="search-button" title="Search"><svg><use href="#i-search"/></svg></button></div>
  <div class="dock" id="dock"></div>
  <div class="task-side"><button class="system-pill" id="notify-open" title="Notifications"><svg><use href="#i-bell"/></svg></button><button class="system-pill" id="quick-open" title="Quick settings"><svg><use href="#i-wifi"/></svg><span>⌃</span></button><div id="clock"></div></div>
 </div>
</div>
<div id="lock-screen" class="hidden"><div><div class="lock-time" id="lock-time"></div><div class="lock-date" id="lock-date"></div><div style="font-size:13px;margin-bottom:14px" id="lock-user"></div><input id="unlock-password" type="password" placeholder="Enter password" style="width:220px"><div><button class="btn primary" id="unlock-button">Unlock axisOS</button></div><div class="small" style="margin-top:14px;color:#a5acc0">Press Enter to unlock · Esc to return</div><div id="unlock-error" class="small" style="color:#ff9b9b;margin-top:8px"></div></div></div>
<script>
/* =========================================================
   System utilities / persistence
========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const STORE='axisOS.v1';
const defaults={
 user:null,wallpaper:'aurora',customWallpaper:'',accent:'#8b9cff',theme:'dark',transparency:78,
 sounds:true,searchEngine:'https://www.google.com/search?q=',installed:['files','settings','music','notes','calculator','calendar','browser','store'],
 dock:['files','notes','browser','music','settings','calculator'],desktop:0,events:[],notes:[],
 files:[{id:'root-docs',name:'Documents',type:'folder',parent:'root'},{id:'root-downloads',name:'Downloads',type:'folder',parent:'root'},{id:'welcome',name:'Welcome.txt',type:'file',parent:'root-docs',content:'Welcome to axisOS.\\n\\nYour personal workspace lives here.'}],
 notifications:[],widgets:true,volume:55
};
let state=loadState(), windows=new Map(), zTop=30, activeDesktop=0, audioCtx=null, currentNote=null, currentPath='root', musicURL=null, musicAudio=new Audio(), browserHistory=[],browserIndex=-1;
function loadState(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return structuredClone(defaults)}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){notify('Storage is full','Some changes could not be saved.')}} 
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)}
function icon(id){return `<span class="app-icon" style="background:${appDefs[id]?.color||'#68738d'}"><svg><use href="#${appDefs[id]?.symbol||'i-grid'}"/></svg></span>`}
function playTone(freq=520,duration=.07){if(!state.sounds)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function notify(title,message=''){state.notifications.unshift({id:uid(),title,message,time:Date.now()});state.notifications=state.notifications.slice(0,30);save();renderNotifications();playTone(660,.05)}
function renderNotifications(){$('#notification-panel').innerHTML=`<div class="panel-head"><strong>Notifications</strong><button class="icon-btn" id="clear-notifications">Clear all</button></div>${state.notifications.length?state.notifications.map(n=>`<div class="notification"><b>${esc(n.title)}</b><div>${esc(n.message)}</div><small>${new Date(n.time).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} <button data-dismiss="${n.id}" style="float:right;background:none;color:var(--muted)">Dismiss</button></small></div>`).join(''):'<p class="muted small">You’re all caught up.</p>'}`;
}
function setAccent(hex){state.accent=hex;const rgb=hex.match(/[a-f\d]{2}/gi).map(x=>parseInt(x,16)).join(',');document.documentElement.style.setProperty('--accent',hex);document.documentElement.style.setProperty('--accent-rgb',rgb);save()}
function applySettings(){document.documentElement.dataset.theme=state.theme;setAccent(state.accent);document.documentElement.style.setProperty('--blur',(8+state.transparency*.22)+'px');$('#wallpaper').style.background=wallpapers[state.wallpaper]||`center/cover url("${state.customWallpaper}")`;$('#widgets').classList.toggle('hidden',!state.widgets)}
const wallpapers={
 aurora:'radial-gradient(ellipse at 75% 20%,#5869a8 0%,transparent 38%),radial-gradient(ellipse at 20% 85%,#27506a 0%,transparent 40%),linear-gradient(135deg,#171d2c,#10131c 65%)',
 dusk:'radial-gradient(ellipse at 75% 75%,#a65c65 0%,transparent 35%),radial-gradient(ellipse at 20% 15%,#4b4e86 0%,transparent 40%),linear-gradient(135deg,#251d36,#10131c)',
 forest:'radial-gradient(ellipse at 70% 20%,#427a65 0%,transparent 38%),radial-gradient(ellipse at 20% 85%,#243f36 0%,transparent 40%),linear-gradient(135deg,#182c2a,#101b20)',
 mono:'radial-gradient(ellipse at 50% 10%,#626b7d 0%,transparent 42%),linear-gradient(135deg,#242936,#10131c)',
 rose:'radial-gradient(ellipse at 80% 20%,#b76d8c 0%,transparent 38%),radial-gradient(ellipse at 15% 90%,#69518b 0%,transparent 42%),linear-gradient(135deg,#32243c,#14131e)'
};
/* =========================================================
   Boot and authentication
========================================================= */
const boot=$('#boot'),auth=$('#auth'),desktop=$('#desktop');
function startBoot(){setTimeout(()=>{boot.classList.add('hidden');if(!state.user)showSetup();else showLogin()},1500)}
function showSetup(){
 auth.classList.remove('hidden');$('#auth-card').innerHTML=`<div class="auth-logo">axis<span>OS</span></div><div class="small muted">FIRST-TIME SETUP</div><h2>Create your space.</h2><p>Set up a local profile for this browser. Your password is hashed locally and never sent anywhere.</p>
 <label>Username</label><input id="setup-name" maxlength="24" placeholder="e.g. Alex" autocomplete="username">
 <label>Local password</label><input id="setup-pass" type="password" minlength="4" placeholder="At least 4 characters" autocomplete="new-password">
 <label>Profile color</label><div class="avatar-choice">${['#8b9cff','#f18baf','#62c6a7','#e3ad65','#ad91ed'].map((c,i)=>`<button data-avatar="${c}" class="${i===0?'selected':''}" style="background:${c}"></button>`).join('')}</div>
 <label>Accent color</label><input id="setup-accent" type="color" value="#8b9cff" style="height:42px;padding:4px">
 <button class="btn primary" id="create-profile">Create profile <span>→</span></button><div class="small muted" style="margin-top:12px">This is a local browser lock, not enterprise-grade security.</div>`;
 let avatar='#8b9cff';$$('[data-avatar]').forEach(b=>b.onclick=()=>{$$('[data-avatar]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');avatar=b.dataset.avatar});
 $('#create-profile').onclick=async()=>{const name=$('#setup-name').value.trim(),pass=$('#setup-pass').value;if(!name||pass.length<4){notifyAuth('Enter a username and a password of at least 4 characters.');return}state.user={name,avatar,passwordHash:await hashPassword(pass),salt:crypto.getRandomValues(new Uint8Array(16)).join(',')};state.accent=$('#setup-accent').value;save();auth.classList.add('hidden');enterDesktop();notify('Welcome to axisOS',`Your workspace is ready, ${name}.`)};
}
function notifyAuth(msg){let n=$('#auth-error');if(!n){n=document.createElement('div');n.id='auth-error';n.className='small';n.style.color='#ff9999';$('#auth-card').append(n)}n.textContent=msg}
async function hashPassword(pass,salt){const enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function showLogin(){auth.classList.remove('hidden');$('#auth-card').innerHTML=`<div class="auth-logo">axis<span>OS</span></div><div style="margin:24px auto 12px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:${state.user.avatar};font-size:23px;color:#172033">${esc(state.user.name[0].toUpperCase())}</div><h2 style="text-align:center;margin:8px 0 4px">Welcome back, ${esc(state.user.name)}.</h2><p style="text-align:center;margin:0 0 20px">Your workspace is waiting.</p><input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" style="width:100%"><button class="btn primary" id="login-button">Sign in</button><div class="small" style="text-align:center;color:#ff9999;margin-top:10px" id="login-error"></div><div class="small muted" style="margin-top:18px;text-align:center">Local browser authentication · not enterprise security</div>`;
 const go=async()=>{const p=$('#login-pass').value,h=await hashPassword(p,state.user.salt);if(h===state.user.passwordHash){auth.classList.add('hidden');enterDesktop()}else $('#login-error').textContent='That password does not match.'};
 $('#login-button').onclick=go;$('#login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')go()});$('#login-pass').focus()}
function enterDesktop(){desktop.classList.remove('hidden');applySettings();renderDesktop();renderDock();renderNotifications();updateClock();notify('System ready','axisOS started successfully.')}
function lock(){desktop.classList.add('hidden');$('#lock-screen').classList.remove('hidden');updateClock();$('#unlock-password').value='';$('#unlock-error').textContent=''}
async function unlock(){if(await hashPassword($('#unlock-password').value,state.user.salt)===state.user.passwordHash){$('#lock-screen').classList.add('hidden');desktop.classList.remove('hidden');$('#unlock-password').value='';playTone(520)}else $('#unlock-error').textContent='Incorrect password.'}
$('#unlock-button').onclick=unlock;$('#unlock-password').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();if(e.key==='Escape'){$('#lock-screen').classList.add('hidden');desktop.classList.remove('hidden')}});
/* =========================================================
   Application registry
========================================================= */
const appDefs={
 files:{name:'Files',symbol:'i-folder',color:'linear-gradient(135deg,#e5b85f,#b67b36)',size:[720,490]},
 settings:{name:'Settings',symbol:'i-settings',color:'linear-gradient(135deg,#8b9bb7,#53617e)',size:[690,490]},
 music:{name:'Music',symbol:'i-music',color:'linear-gradient(135deg,#d78ab5,#865bb7)',size:[520,440]},
 notes:{name:'Notes',symbol:'i-note',color:'linear-gradient(135deg,#e6c16b,#b38b3c)',size:[700,470]},
 calculator:{name:'Calculator',symbol:'i-calc',color:'linear-gradient(135deg,#6fc3b4,#3c8e91)',size:[350,490]},
 calendar:{name:'Calendar',symbol:'i-calendar',color:'linear-gradient(135deg,#e88787,#b84d68)',size:[680,500]},
 browser:{name:'Browser',symbol:'i-browser',color:'linear-gradient(135deg,#79a9e8,#5269b4)',size:[820,550]},
 store:{name:'App Store',symbol:'i-store',color:'linear-gradient(135deg,#8f9cf3,#5968bd)',size:[700,500]},
 terminal:{name:'Terminal',symbol:'i-file',color:'linear-gradient(135deg,#46536a,#202b40)',size:[600,400]},
 photos:{name:'Photos',symbol:'i-grid',color:'linear-gradient(135deg,#e5a36f,#bd6e6e)',size:[600,440]}
};
function renderDesktop(){
 const ids=['files','notes','browser','music','calculator','calendar','settings'];
 $('#desktop-icons').innerHTML=ids.filter(id=>state.installed.includes(id)).map(id=>`<button class="desktop-icon" draggable="true" data-open="${id}">${icon(id)}<span>${appDefs[id].name}</span></button>`).join('');
 $('#desktop-icons').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp(b.dataset.open));
}
function renderDock(){
 $('#dock').innerHTML=state.dock.filter(id=>state.installed.includes(id)).map(id=>`<button class="dock-btn ${windows.has(id)?'running':''}" data-dock="${id}" title="${appDefs[id].name}">${icon(id)}</button>`).join('');
 $('#dock').querySelectorAll('[data-dock]').forEach(b=>b.onclick=()=>openApp(b.dataset.dock));
}
function openApp(id){
 if(!state.installed.includes(id)){notify('App not installed',`${appDefs[id]?.name||id} is not installed.`);return}
 playTone(460);$('#start-menu').classList.add('hidden');$('#search-panel').classList.add('hidden');
 if(windows.has(id)){const w=windows.get(id);w.el.classList.remove('hidden');focusWindow(w.el);return}
 const def=appDefs[id];if(!def)return;
 const [w,h]=def.size,el=document.createElement('section');el.className='os-window';el.dataset.app=id;el.dataset.desktop=String(activeDesktop);
 el.style.width=Math.min(w,innerWidth-20)+'px';el.style.height=Math.min(h,innerHeight-90)+'px';
 el.style.left=Math.max(8,(innerWidth-w)/2+(windows.size%5)*22)+'px';el.style.top=Math.max(8,(innerHeight-h-70)/2+(windows.size%5)*17)+'px';
 el.innerHTML=`<div class="window-titlebar"><span class="app-icon" style="width:27px;height:27px;border-radius:8px;background:${def.color}"><svg style="width:15px;height:15px"><use href="#${def.symbol}"/></svg></span><span class="window-title">${def.name}</span><div class="window-controls"><button data-min title="Minimize"><svg><use href="#i-minus"/></svg></button><button data-max title="Maximize"><svg><use href="#i-max"/></svg></button><button class="close" data-close title="Close"><svg><use href="#i-x"/></svg></button></div></div><div class="window-body" id="body-${id}">${appRender[id]()}</div><div class="resize-handle"></div>`;
 $('#window-layer').append(el);const record={el,id};windows.set(id,record);focusWindow(el);wireWindow(el);
 renderDock();wireApp(id,el);
}
function focusWindow(el){$$('.os-window').forEach(w=>w.classList.remove('focused'));el.classList.add('focused');el.style.zIndex=++zTop}
function wireWindow(el){
 el.addEventListener('pointerdown',()=>focusWindow(el));
 const bar=$('.window-titlebar',el);bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;focusWindow(el);if(el.classList.contains('maximized'))return;const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;bar.setPointerCapture(e.pointerId);const move=ev=>{el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,ox+ev.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-90,oy+ev.clientY-sy))+'px'};const up=ev=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);if(ev.clientY<14){el.classList.add('maximized')}else if(ev.clientX<12){el.classList.add('snapped-left')}else if(ev.clientX>innerWidth-12){el.classList.add('snapped-right')}};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up)});
 $('[data-close]',el).onclick=()=>closeWindow(el.dataset.app);
 $('[data-min]',el).onclick=()=>el.classList.add('hidden');
 $('[data-max]',el).onclick=()=>{el.classList.remove('snapped-left','snapped-right');el.classList.toggle('maximized')};
 const handle=$('.resize-handle',el);handle.addEventListener('pointerdown',e=>{e.preventDefault();focusWindow(el);const sx=e.clientX,sy=e.clientY,sw=el.offsetWidth,sh=el.offsetHeight;const move=ev=>{el.style.width=Math.max(280,Math.min(innerWidth-el.offsetLeft,sw+ev.clientX-sx))+'px';el.style.height=Math.max(190,Math.min(innerHeight-el.offsetTop-70,sh+ev.clientY-sy))+'px'};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)});
}
function closeWindow(id){const w=windows.get(id);if(!w)return;w.el.style.opacity='0';w.el.style.transform='scale(.97)';setTimeout(()=>w.el.remove(),160);windows.delete(id);renderDock();if(id==='music'&&musicURL){URL.revokeObjectURL(musicURL);musicURL=null;musicAudio.pause()}}
/* =========================================================
   Individual applications
========================================================= */
const appRender={
 files:()=>`<div class="app-toolbar"><button class="btn" id="file-back">←</button><span class="muted small" id="file-path">Home</span><span style="flex:1"></span><button class="btn" id="new-folder">New folder</button><button class="btn primary" id="new-file">New file</button></div><div class="file-grid" id="file-grid"></div>`,
 notes:()=>`<div class="note-layout"><div class="note-list"><button class="btn primary" id="new-note" style="width:100%;margin-bottom:10px">＋ New note</button><div id="note-items"></div></div><div class="note-editor"><input id="note-title" placeholder="Untitled note"><textarea id="note-content" placeholder="Start writing…"></textarea><div class="small muted" id="note-status">Saved automatically</div></div></div>`,
 calculator:()=>`<div class="calc"><input class="calc-display" id="calc-display" value="0" readonly><div class="calc-grid">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map((x,i)=>`<button class="${[3,7,11,15].includes(i)?'operator':''} ${x==='='?'equal':''}" data-calc="${x}">${x}</button>`).join('')}</div></div>`,
 settings:()=>`<div class="settings-layout"><nav class="settings-nav">${['Appearance','Wallpaper','Personalization','Sound','Account','System'].map((x,i)=>`<button data-settings-tab="${x}" class="${i===0?'active':''}">${x}</button>`).join('')}</nav><div class="settings-content" id="settings-content"></div></div>`,
 calendar:()=>`<div class="calendar-head"><button class="icon-btn" id="cal-prev">‹</button><strong id="cal-month"></strong><button class="icon-btn" id="cal-next">›</button><button class="btn" id="add-event">＋ Event</button></div><div class="calendar-grid" id="calendar-grid"></div><div class="app-section-title">Upcoming events</div><div id="event-list" class="small"></div>`,
 music:()=>`<div class="music-layout"><div class="album-art"><svg><use href="#i-music"/></svg></div><div><div id="track-name" style="font-weight:650">No track selected</div><div id="track-meta" class="muted small">Choose an audio file from your device</div></div><input id="music-file" type="file" accept="audio/*" class="hidden"><button class="btn" id="choose-music">Choose audio file</button><input type="range" id="music-progress" class="progress" min="0" max="100" value="0"><div class="music-controls"><button class="icon-btn" id="music-back">↺</button><button class="btn primary" id="music-toggle">▶ Play</button><button class="icon-btn" id="music-forward">↻</button></div><div class="small muted">Volume <input id="music-volume" type="range" min="0" max="100" value="${state.volume}" style="width:110px;vertical-align:middle"></div></div>`,
 browser:()=>`<div class="browser-bar"><button class="icon-btn" id="browser-back">‹</button><button class="icon-btn" id="browser-forward">›</button><button class="icon-btn" id="browser-refresh">↻</button><input id="browser-address" placeholder="Search or enter a website address"><button class="btn" id="browser-go">Go</button><button class="icon-btn" id="browser-external" title="Open in new tab">↗</button></div><div id="browser-view" style="height:calc(100% - 57px)"><div class="browser-placeholder"><div><div class="app-icon" style="margin:0 auto 15px;background:${appDefs.browser.color}"><svg><use href="#i-browser"/></svg></div><h2 style="font-size:20px">A window to the web.</h2><p class="muted small">Enter a URL or search term above.</p><p class="muted small">Some sites block embedded viewing. Use ↗ to open them in a new tab.</p></div></div></div>`,
 store:()=>`<div class="app-section-title">Discover axisOS apps</div><p class="muted small">Small tools that live inside your desktop. Install or remove optional apps.</p><div id="store-list"></div>`,
 terminal:()=>`<div style="font:12px ui-monospace,monospace;background:#0c1019;color:#b7d8c2;height:100%;padding:14px;border-radius:10px;overflow:auto" id="terminal-output">axisOS terminal · type "help"<br><br><span style="color:#8b9cff">guest@axisOS</span>:~$ <input id="terminal-input" style="background:transparent;border:0;color:#fff;width:70%;font:inherit;padding:0" autocomplete="off"></div>`,
 photos:()=>`<div class="app-toolbar"><input id="photo-files" type="file" accept="image/*" multiple></div><div id="photo-grid" class="file-grid"></div>`
};
function wireApp(id,el){
 const q=s=>$(s,el),body=$('.window-body',el);
 if(id==='files')wireFiles(el);
 if(id==='notes')wireNotes(el);
 if(id==='calculator')wireCalculator(el);
 if(id==='settings')wireSettings(el);
 if(id==='calendar')wireCalendar(el);
 if(id==='music')wireMusic(el);
 if(id==='browser')wireBrowser(el);
 if(id==='store')wireStore(el);
 if(id==='terminal')wireTerminal(el);
 if(id==='photos')wirePhotos(el);
}
/* Files: virtual filesystem, CRUD and text editor */
function wireFiles(el){
 const q=s=>$(s,el),render=()=>{const items=state.files.filter(f=>f.parent===currentPath);q('#file-path').textContent=currentPath==='root'?'Home':state.files.find(f=>f.id===currentPath)?.name||'Home';q('#file-grid').innerHTML=items.map(f=>`<button class="file-item" data-file="${f.id}"><svg><use href="#${f.type==='folder'?'i-folder':'i-file'}"/></svg><span>${esc(f.name)}</span></button>`).join('')||'<p class="muted small">This folder is empty.</p>';$$('[data-file]',el).forEach(b=>b.ondblclick=()=>{const f=state.files.find(x=>x.id===b.dataset.file);if(f.type==='folder'){currentPath=f.id;render()}else editVirtualFile(f)})};
 q('#file-back').onclick=()=>{if(currentPath!=='root'){const f=state.files.find(x=>x.id===currentPath);currentPath=f?.parent||'root';render()}};
 q('#file-grid').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-file]');if(!b)return;e.preventDefault();const f=state.files.find(x=>x.id===b.dataset.file);const action=prompt(`Manage ${f.name}: type rename or delete`);if(action==='rename'){const name=prompt('New name',f.name);if(name?.trim()){f.name=name.trim();save();render()}}else if(action==='delete'&&confirm(`Delete ${f.name}?`)){const remove=new Set([f.id]);let changed=true;while(changed){changed=false;state.files.forEach(x=>{if(remove.has(x.parent)&&!remove.has(x.id)){remove.add(x.id);changed=true}})}state.files=state.files.filter(x=>!remove.has(x.id));save();render()}});
 q('#new-folder').onclick=()=>{const name=prompt('Folder name');if(name?.trim()){state.files.push({id:uid(),name:name.trim(),type:'folder',parent:currentPath});save();render()}};
 q('#new-file').onclick=()=>{const name=prompt('Text file name','New document.txt');if(name?.trim()){const f={id:uid(),name:name.trim(),type:'file',parent:currentPath,content:''};state.files.push(f);save();render();editVirtualFile(f)}};
 render();
}
function editVirtualFile(f){const value=prompt(`Edit ${f.name}`,f.content||'');if(value!==null){f.content=value;save();notify('File saved',f.name)}}
/* Notes */
function wireNotes(el){
 const q=s=>$(s,el);if(!state.notes.length)state.notes.push({id:uid(),title:'Welcome to Notes',content:'A quiet place for your thoughts.'});
 const render=()=>{q('#note-items').innerHTML=state.notes.map(n=>`<button data-note="${n.id}" class="${n.id===currentNote?'active':''}">${esc(n.title||'Untitled')}</button>`).join('');$$('[data-note]',el).forEach(b=>b.onclick=()=>select(b.dataset.note))};
 const select=id=>{currentNote=id;const n=state.notes.find(x=>x.id===id);q('#note-title').value=n?.title||'';q('#note-content').value=n?.content||'';render()};

/* Calculator: safe arithmetic parser */
function wireCalculator(el){
 let expr='0';const display=$('#calc-display',el);const paint=()=>display.value=expr;
 const calculate=()=>{try{let s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/(). ]+$/.test(s))throw Error();const result=Function('"use strict";return ('+s+')')();if(!Number.isFinite(result))throw Error();expr=String(Number(result.toPrecision(11)))}catch(e){expr='Error'}paint()};
 $$('[data-calc]',el).forEach(b=>b.onclick=()=>{const x=b.dataset.calc;if(x==='AC')expr='0';else if(x==='⌫')expr=expr.length>1?expr.slice(0,-1):'0';else if(x==='=')calculate();else if(x==='±')expr=expr.startsWith('-')?expr.slice(1):'-'+expr;else expr=expr==='0'&&/[0-9]/.test(x)?x:expr+x;paint();playTone(420,.035)});
 el.addEventListener('keydown',e=>{if(/^[0-9.+*/()-]$/.test(e.key)){expr+=e.key;paint()}else if(e.key==='Enter'){calculate()}else if(e.key==='Backspace'){expr=expr.slice(0,-1);paint()}});
}

/* Calendar */

 const q=s=>$(s,el),render=()=>{const y=calDate.getFullYear(),m=calDate.getMonth();q('#cal-month').textContent=calDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let out=names.map(n=>`<div class="day-name">${n}</div>`).join('');for(let i=0;i<first;i++)out+='<div style="background:transparent"></div>';for(let d=1;d<=days;d++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,today=new Date().toDateString()===new Date(y,m,d).toDateString(),has=state.events.some(e=>e.date===key);out+=`<div class="${today?'today':''} ${has?'has-event':''}" data-day="${key}">${d}</div>`}q('#calendar-grid').innerHTML=out;q('#event-list').innerHTML=state.events.filter(e=>e.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(e.title)}</b> <span class="muted">${e.date}</span></div>`).join('')||'<span class="muted">No upcoming events.</span>'};
